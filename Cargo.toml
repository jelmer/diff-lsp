[package]
name = "diff-lsp"
version = "0.1.1"
edition = "2021"
authors = ["Jelmer Vernooij <jelmer@jelmer.uk>"]
description = "Language Server Protocol implementation for diff/patch files"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/jelmer/diff-lsp"
keywords = ["lsp", "diff", "patch", "language-server"]
categories = ["development-tools", "text-editors"]

[dependencies]
patchkit = "0.2.7"
rowan = "0.16.1"
serde_json = "1"
text-size = "1.1"
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
scip = "0.8.1"

[dev-dependencies]
protobuf = "3"
tempfile = "3"

[[bin]]
name = "diff-lsp"
test = true

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  build-server:
    name: Build server (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            vscode-target: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            vscode-target: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            vscode-target: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            vscode-target: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            vscode-target: win32-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging/server
          cp target/${{ matrix.target }}/release/diff-lsp staging/server/

      - name: Prepare binary (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir staging/server
          cp target/${{ matrix.target }}/release/diff-lsp.exe staging/server/

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.vscode-target }}
          path: staging/server/

  package-vsix:
    name: Package VSIX (${{ matrix.vscode-target }})
    needs: build-server
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vscode-target:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - win32-x64
    defaults:
      run:
        working-directory: vscode-diff-lsp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-diff-lsp/package-lock.json
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: server-${{ matrix.vscode-target }}
          path: vscode-diff-lsp/server/

      - name: Mark server binary executable
        if: matrix.vscode-target != 'win32-x64'
        run: chmod +x server/diff-lsp

      - run: npx tsc -p ./
      - run: npx vsce package --target ${{ matrix.vscode-target }} -o ../vscode-diff-lsp-${{ matrix.vscode-target }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vscode-target }}
          path: vscode-diff-lsp-${{ matrix.vscode-target }}.vsix

  package-universal:
    name: Package universal VSIX
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-diff-lsp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-diff-lsp/package-lock.json
      - run: npm ci
      - run: npx tsc -p ./
      - run: npx vsce package -o ../vscode-diff-lsp-universal.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-universal
          path: vscode-diff-lsp-universal.vsix

  publish-coc:
    name: Publish coc-diff to npm
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: coc-diff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: coc-diff/package-lock.json
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public

  release:
    name: Create release
    needs: [package-vsix, package-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
